name: Build Firmware

# nxmk: only the radio-free HHKB Hybrid (ANSI) image is built.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-hhkb-hybrid:
    name: Build HHKB Hybrid ANSI (no Bluetooth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl xz-utils

      - name: Set up pinned HHKB compiler
        uses: ./.github/actions/setup-hhkb-toolchain

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build
        run: ./build_all.sh -b hhkb -d HHKB_HYBRID -c

      - name: Size, vector and no-Bluetooth gates
        run: |
          bash tools/nxmk/check_image.sh
          if arm-none-eabi-nm build/hhkb-script/nxmk_hhkb_stm32l072 | grep -iE 'bluetooth|_bt_|nrf|pairing|gatt'; then
            echo "Bluetooth symbols found"; exit 1
          fi

      - name: Package
        run: |
          mkdir -p build/nxmk-release
          cp build/hhkb-script/nxmk_hhkb_stm32l072.bin build/nxmk-release/nxmk-hhkb-hybrid-ansi.bin
          cp tools/hhkb/hhkb.html keyboards/hhkb/via.json build/nxmk-release/

      - uses: actions/upload-artifact@v7
        with:
          name: nxmk-hhkb-hybrid-ansi
          path: build/nxmk-release/
          retention-days: 3
          if-no-files-found: error
